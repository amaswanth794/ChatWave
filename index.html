
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatWave | Messaging</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#0b1120;--panel:#111b2e;--line:#243149;
--green:#22c987;--text:#edf4ff;--muted:#8b9bb4}
body{font-family:Arial,sans-serif;background:var(--bg);
color:var(--text);height:100vh;overflow:hidden}
.app{height:100vh;display:flex;max-width:1500px;margin:auto;
background:var(--panel)}
.sidebar{width:350px;min-width:290px;border-right:1px solid var(--line);
display:flex;flex-direction:column}
.brand{padding:24px;font-size:25px;font-weight:bold;
border-bottom:1px solid var(--line)}
.brand span{color:var(--green)}
.profile{padding:18px 22px;display:flex;align-items:center;gap:12px;
border-bottom:1px solid var(--line)}
.avatar{width:46px;height:46px;border-radius:50%;display:grid;
place-items:center;background:#263e55;font-size:23px;flex-shrink:0}
.online{color:var(--green);font-size:12px;margin-top:5px}
.search{padding:15px}
.search input{width:100%;padding:13px;border-radius:10px;
border:1px solid var(--line);background:#0b1425;color:white;outline:none}
.contact-title{padding:5px 20px 12px;color:var(--muted);
font-size:12px;text-transform:uppercase;letter-spacing:1px}
.contacts{overflow-y:auto;flex:1}
.contact{padding:15px 18px;display:flex;gap:12px;align-items:center;
cursor:pointer;border-left:3px solid transparent}
.contact:hover,.contact.active{background:#1a2940}
.contact.active{border-left-color:var(--green)}
.contact-info{flex:1;min-width:0}
.contact-info strong{font-size:14px}
.contact-info p{font-size:12px;color:var(--muted);margin-top:7px;
white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.contact .time{font-size:10px;color:var(--muted)}
.chat{flex:1;min-width:0;display:flex;flex-direction:column}
.chat-header{padding:17px 23px;border-bottom:1px solid var(--line);
display:flex;align-items:center;gap:13px}
.chat-header .details{flex:1}
.chat-header p{color:var(--green);font-size:12px;margin-top:5px}
.header-actions{color:var(--muted);font-size:20px}
.messages{flex:1;overflow-y:auto;padding:26px 5%;
display:flex;flex-direction:column;gap:16px;
background:radial-gradient(ellipse at top,#14223a 0%,#0b1220 75%)}
.date{text-align:center;font-size:11px;color:var(--muted);
background:#19253a;padding:8px 14px;border-radius:20px;
align-self:center;margin-bottom:8px}
.msg{max-width:75%;padding:12px 15px;border-radius:15px;
font-size:14px;line-height:1.55;overflow-wrap:anywhere}
.msg small{display:block;text-align:right;font-size:10px;
margin-top:5px;opacity:.65}
.received{background:#202e43;align-self:flex-start;
border-bottom-left-radius:4px}
.sent{background:#087d5a;align-self:flex-end;
border-bottom-right-radius:4px}
.composer{padding:17px 22px;display:flex;gap:10px;align-items:center;
border-top:1px solid var(--line);background:#111b2e}
.composer input{flex:1;min-width:0;padding:14px 17px;
border:1px solid var(--line);border-radius:25px;
background:#0b1425;color:white;font-size:14px;outline:none}
.composer input:focus,.search input:focus{border-color:var(--green)}
.icon-btn{border:0;background:transparent;color:var(--muted);
font-size:21px;cursor:pointer;padding:7px}
.send{background:var(--green);color:#061b13;width:45px;height:45px;
border:0;border-radius:50%;font-size:19px;cursor:pointer}
.send:hover{filter:brightness(1.1)}
.mobile-back{display:none}
.empty{color:var(--muted);text-align:center;margin:auto;padding:20px}
@media(max-width:650px){
 .sidebar{width:100%;min-width:0;border:0}
 .chat{display:none}
 .app.chat-open .sidebar{display:none}
 .app.chat-open .chat{display:flex;width:100%}
 .mobile-back{display:block}
 .brand{padding:19px}
 .messages{padding:20px 14px}
 .chat-header{padding:14px}
 .composer{padding:12px}
 .msg{max-width:88%}
}
</style>
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar">
    <div class="brand">Chat<span>Wave</span> ✦</div>
    <div class="profile">
      <div class="avatar">🧑</div>
      <div><strong>You</strong><div class="online">● Online</div></div>
    </div>
    <div class="search">
      <input id="search" placeholder="⌕  Search conversations..." />
    </div>
    <div class="contact-title">Messages</div>
    <div class="contacts" id="contacts"></div>
  </aside>

  <main class="chat">
    <header class="chat-header">
      <button class="icon-btn mobile-back" id="back">←</button>
      <div class="avatar" id="headAvatar">👩</div>
      <div class="details">
        <strong id="headName">Ananya</strong>
        <p id="headStatus">● Online</p>
      </div>
      <div class="header-actions">⋯</div>
    </header>

    <section class="messages" id="messages" aria-live="polite"></section>

    <form class="composer" id="form">
      <button type="button" class="icon-btn" id="emoji" title="Add emoji">☺</button>
      <input id="messageInput" placeholder="Type your message..."
        autocomplete="off" maxlength="2000" />
      <button class="send" type="submit" aria-label="Send message">➤</button>
    </form>
  </main>
</div>

<script>
const people = [
 {id:1,name:"Ananya",avatar:"👩",status:"Online",preview:"Hey! How are you?"},
 {id:2,name:"Rahul",avatar:"🧑‍💻",status:"Online",preview:"Let's catch up soon!"},
 {id:3,name:"Priya",avatar:"👩‍🎨",status:"Away",preview:"That design looks amazing"},
 {id:4,name:"Arjun",avatar:"🧔",status:"Offline",preview:"Thanks for your help!"},
 {id:5,name:"Meera",avatar:"👩‍🦱",status:"Online",preview:"See you tomorrow 😊"}
];

const initial = {
 1:[{from:"them",text:"Hey! Welcome to ChatWave 👋"},
    {from:"them",text:"How are you doing today?"},
    {from:"me",text:"I'm good! How about you?"},
    {from:"them",text:"Doing great! 😊"}],
 2:[{from:"them",text:"Hey! Let's catch up soon!"}],
 3:[{from:"them",text:"That design looks amazing 🎨"}],
 4:[{from:"them",text:"Thanks for your help!"}],
 5:[{from:"them",text:"See you tomorrow 😊"}]
};

let chats = {};
try {
  chats = JSON.parse(localStorage.getItem("chatwave_chats") || "{}");
} catch(e) { chats = {}; }

people.forEach(p => {
 if (!Array.isArray(chats[p.id])) chats[p.id] = initial[p.id] || [];
});
let selected = 1;

const $ = id => document.getElementById(id);
const safe = text => String(text).replace(/[&<>"']/g,
 c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function save(){
 try { localStorage.setItem("chatwave_chats",JSON.stringify(chats)); }
 catch(e) {}
}

function timeNow(){
 return new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit"});
}

function renderContacts(){
 const q=$("search").value.toLowerCase();
 $("contacts").innerHTML=people.filter(p=>
  (p.name+" "+(p.preview||"")).toLowerCase().includes(q)
 ).map(p=>{
  const list=chats[p.id]||[];
  const last=list[list.length-1];
  return `<div class="contact ${p.id===selected?"active":""}"
    data-id="${p.id}" tabindex="0" role="button">
    <div class="avatar">${p.avatar}</div>
    <div class="contact-info"><strong>${safe(p.name)}</strong>
    <p>${safe(last?last.text:p.preview)}</p></div>
    <span class="time">${last?safe(last.time||""): ""}</span>
   </div>`;
 }).join("");
}

function renderChat(){
 const p=people.find(x=>x.id===selected);
 $("headName").textContent=p.name;
 $("headAvatar").textContent=p.avatar;
 $("headStatus").textContent=(p.status==="Online"?"● ":"")+p.status;
 $("headStatus").style.color=p.status==="Online"?"var(--green)":"var(--muted)";
 const box=$("messages");
 const list=chats[selected]||[];
 box.innerHTML='<div class="date">TODAY</div>'+list.map(m=>
  `<div class="msg ${m.from==="me"?"sent":"received"}">
    ${safe(m.text)}<small>${safe(m.time||"")}${m.from==="me"?" ✓✓":""}</small>
  </div>`
 ).join("");
 box.scrollTop=box.scrollHeight;
 renderContacts();
}

$("contacts").addEventListener("click",e=>{
 const el=e.target.closest(".contact");
 if(!el)return;
 selected=Number(el.dataset.id);
 $("app").classList.add("chat-open");
 renderChat();
});
$("contacts").addEventListener("keydown",e=>{
 if(e.key==="Enter"||e.key===" "){
  const el=e.target.closest(".contact");
  if(el){e.preventDefault();selected=Number(el.dataset.id);
   $("app").classList.add("chat-open");renderChat();}
 }
});
$("search").addEventListener("input",renderContacts);
$("back").addEventListener("click",()=>$("app").classList.remove("chat-open"));

$("emoji").addEventListener("click",()=>{
 $("messageInput").value+=" 😊";
 $("messageInput").focus();
});

$("form").addEventListener("submit",e=>{
 e.preventDefault();
 const input=$("messageInput");
 const text=input.value.trim();
 if(!text)return;
 chats[selected].push({from:"me",text,time:timeNow()});
 input.value="";
 save();
 renderChat();
});

// Demo replies: clearly simulated, not messages from real people.
let replyTimers={};
$("form").addEventListener("submit",()=>{
 const id=selected;
 clearTimeout(replyTimers[id]);
 replyTimers[id]=setTimeout(()=>{
  const p=people.find(x=>x.id===id);
  if(!p)return;
  const replies=["That's great! 😊","Nice! Tell me more.",
   "Sounds good 👍","Haha, absolutely!","Thanks for sharing!"];
  chats[id].push({from:"them",
   text:replies[Math.floor(Math.random()*replies.length)],
   time:timeNow()});
  p.preview=chats[id][chats[id].length-1].text;
  save();
  if(selected===id)renderChat();
  else renderContacts();
 },1200);
});

renderChat();
</script>
</body>
</html>
